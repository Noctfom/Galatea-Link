# config.yaml
server:
  profile: "mdpro3"
  host: "127.0.0.1"
  port: 7911
  password: ""
  protocol_version: 0x1361
  game_id: 0
  connect_timeout: 10.0
  trace_packets: true

agent:
  name: "Galatea_AI"
  deck: "神秘白龙"
  prefer_second: false       # true 为后手，false 为先手

model:
  device: "cpu"              # 未来如果要上服务器可以改成 "cuda"
  weights_path: "./models/galatea_iter_110.pth"
  config:
    d_model: 512
    n_heads: 8
    n_layers: 6
    vocab_size: 20000

llm:
  enabled: true
  provider: "openai_compatible"
  base_url: "https://api.deepseek.com/v1"
  api_key: ""                  # 推荐留空并通过下方环境变量提供
  api_key_env: "GALATEA_LLM_API_KEY"
  model: "deepseek-v4-flash"
  timeout: 30.0
  max_tokens: 256
  temperature: 0.1
  response_format: "json_object" # 可选 json_object、json_schema、none
  trace_requests: true            # 记录输入规模、耗时、结束原因和 token 用量
  thinking_mode: "disabled"       # 实时决策关闭思考以降低延迟和输出费用
  cache_static_context: true      # 将固定卡组知识放在动态观察之前以命中前缀缓存
  cache_deck_text: false          # 开启后缓存整副卡组效果文本但首次请求更大
  compact_dynamic_observation: true # 删除固定前缀已经提供的重复字段

decision:
  mode: "llm_review"               # 可选 core_only、llm_only、llm_review、hybrid
  core_confidence_threshold: 0.65
  force_llm_message_types: []      # hybrid 模式下强制交给 LLM 的 OCG 消息类型
  include_core_suggestion: true
  llm_time_budget: 12.0            # 超过预算就取消 LLM 并立即安全回退
  autonomous_intervention_enabled: false # LLM 自主调整后续介入策略的总开关
  autonomous_allowed_modes: ["core_only", "hybrid", "llm_review", "llm_only"]
  autonomous_core_confidence_min: 0.2
  autonomous_core_confidence_max: 0.9
  autonomous_max_ttl_decisions: 3  # 单次自主调整最多持续的后续决策数
  autonomous_max_force_message_types: 8
